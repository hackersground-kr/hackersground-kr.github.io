<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행사 · 해커그라운드</title>
    <meta name="description" content="해커그라운드의 대구경북 클라우드 개발자 커뮤니티 행사입니다.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="legacy-event-content.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        .post-hero { padding: 8rem 0 4rem; background: linear-gradient(135deg, rgba(0,255,65,0.08), rgba(0,0,0,0.95)); min-height: 45vh; display: flex; align-items: center; }
        .post-content-section { padding: 4rem 0; background: var(--dark-bg); }
        .video-embed { position: relative; width: 100%; padding-top: 56.25%; margin: 1.5rem 0; }
        .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        body[data-content-format="legacy-html"] .post-content-section { padding: 0; }
        body[data-content-format="legacy-html"] [data-content-wrapper] { display: contents; }
        body[data-content-format="legacy-html"] [data-content-hero],
        body[data-content-format="legacy-html"] [data-content-cta] { display: none !important; }
        body[data-content-format="legacy-html"] .legacy-event-content .event-detail-hero {
            min-height: 0;
            padding: clamp(5.5rem, 10vw, 8rem) 0 clamp(2.5rem, 5vw, 4rem);
        }
        body[data-content-format="legacy-html"] .legacy-event-content > section:not(.event-detail-hero) {
            padding: clamp(2.5rem, 5vw, 4rem) 0 !important;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .event-info-card,
        body[data-content-format="legacy-html"] .legacy-event-content .info-box {
            margin-bottom: clamp(2rem, 4vw, 3rem);
            padding: clamp(1.25rem, 3vw, 2rem);
            border-radius: 16px;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .event-meta-grid,
        body[data-content-format="legacy-html"] .legacy-event-content .info-grid {
            gap: clamp(0.9rem, 2vw, 1.5rem);
        }
        body[data-content-format="legacy-html"] .legacy-event-content .meta-item,
        body[data-content-format="legacy-html"] .legacy-event-content .info-row {
            align-items: flex-start;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .content-section {
            margin-bottom: clamp(2rem, 4vw, 3rem);
        }
        body[data-content-format="legacy-html"] .legacy-event-content .legacy-share-controls {
            margin-top: 1.5rem;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .legacy-share-controls [data-content-share-result] {
            margin: 0.65rem 0 0;
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .btn-primary,
        body[data-content-format="legacy-html"] .legacy-event-content .apply-button {
            color: var(--dark-bg) !important;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .registration-closed {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.18) !important;
            box-shadow: none !important;
            color: #9ca3af !important;
            cursor: not-allowed;
            pointer-events: none;
        }
        body[data-content-format="legacy-html"] .legacy-event-content .sticky-apply.registration-bar-closed {
            border-top-color: rgba(255,255,255,0.18);
        }
        body[data-content-format="legacy-html"] .legacy-event-content .sticky-apply.registration-bar-closed .apply-deadline,
        body[data-content-format="legacy-html"] .legacy-event-content .sticky-apply.registration-bar-closed .deadline {
            color: #9ca3af;
        }
        @media (max-width: 768px) {
            body[data-content-format="legacy-html"] .legacy-event-content .event-detail-hero {
                padding: 5rem 0 2.25rem;
            }
            body[data-content-format="legacy-html"] .legacy-event-content .event-info-card,
            body[data-content-format="legacy-html"] .legacy-event-content .info-box {
                padding: 1.25rem;
                border-radius: 14px;
            }
            body[data-content-format="legacy-html"] .legacy-event-content .event-meta-grid,
            body[data-content-format="legacy-html"] .legacy-event-content .info-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            body[data-content-format="legacy-html"] .legacy-event-content .session-item {
                flex-direction: column;
                gap: 0.75rem;
                padding: 1rem 1.125rem;
            }
            body[data-content-format="legacy-html"] .legacy-event-content .session-date {
                min-width: 0;
            }
        }
        .content-share { font: inherit; padding: 0.55rem 1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><a href="/"><img src="../images/1920x480-1.png" alt="해커그라운드 로고" class="logo-image"></a></div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="/events/" class="nav-link" style="color: var(--primary-green);">Events</a></li>
                <li class="nav-item"><a href="/posts/" class="nav-link">Posts</a></li>
                <li class="nav-item"><a href="/#about" class="nav-link">About</a></li>
            </ul>
            <div class="nav-toggle" id="mobile-menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
        </div>
    </nav>
    <section class="post-hero" data-content-hero>
        <div class="container" style="max-width: 860px;">
            <div class="breadcrumb"><a href="/">Home</a><span class="sep">›</span><a href="/events/">Events</a></div>
            <span class="badge" data-content-tag style="margin-bottom: 1.5rem; display: inline-block;">행사</span>
            <h1 class="hero-title" data-content-title style="font-size: clamp(1.8rem, 4vw, 3rem);">행사를 불러오는 중입니다</h1>
            <p class="hero-subtitle" data-content-excerpt style="font-size: 1rem;"></p>
            <p class="hero-subtitle" data-content-event-meta hidden style="font-size: 1rem;"></p>
            <p class="hero-subtitle" data-content-views style="font-size: 0.9rem;"></p>
            <button type="button" class="btn-secondary content-share" data-content-share hidden>🔗 공유하기</button>
            <p data-content-share-result aria-live="polite"></p>
        </div>
    </section>
    <section class="post-content-section" data-content-shell>
        <div class="container" data-content-wrapper style="max-width: 860px;">
            <article class="prose" data-content-detail="event"></article>
            <div class="community-cta" data-content-cta style="margin-top: 4rem;">
                <h3 data-content-cta-title>지금 신청하기</h3>
                <p data-content-cta-description>참가 신청은 아래 버튼에서 진행할 수 있어요.</p>
                <div class="btn-group">
                    <a class="btn-primary" data-content-registration hidden>지금 신청하기</a>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2026 해커그라운드(Hackers Ground). All rights reserved.</p></div></div>
    </footer>
    <script src="../js/main.js"></script>
    <script src="../js/content.js"></script>
</body>
</html>
