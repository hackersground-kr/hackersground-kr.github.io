    <script>

        // 날짜 기준 정렬: 미래 행사를 날짜 오름차순, 과거 행사를 날짜 내림차순(최신→오래된)으로 정렬
        function sortEvents() {
            var grid = document.querySelector('.events-grid');
            if (!grid) return;
            var today = new Date(); today.setHours(0,0,0,0);
            var cards = Array.from(grid.querySelectorAll('.event-card[data-date]'));
            var upcoming = [], past = [];
            cards.forEach(function(c) {
                var d = new Date(c.dataset.date);
                (d >= today ? upcoming : past).push(c);
            });
            upcoming.sort(function(a,b){ return new Date(a.dataset.date) - new Date(b.dataset.date); });
            past.sort(function(a,b){ return new Date(b.dataset.date) - new Date(a.dataset.date); });
            upcoming.concat(past).forEach(function(c){ grid.appendChild(c); });

            // 지난 행사는 신청 마감 상태로 표시
            past.forEach(function(c) {
                if (!c.querySelector('.past-badge')) {
                    var b = document.createElement('span');
                    b.className = 'past-badge';
                    b.textContent = '신청마감';
                    b.style.cssText = 'display:inline-block;background:rgba(255,255,255,0.1);color:#9ca3af;font-size:0.72rem;font-weight:700;padding:0.15rem 0.55rem;border-radius:999px;margin-left:0.5rem;vertical-align:middle;';
                    var title = c.querySelector('.event-title');
                    if (title) title.appendChild(b);
                }
            });
        }
        sortEvents();

        function filterEvents(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('filter-' + type).classList.add('active');
            document.querySelectorAll('.event-card').forEach(card => {
                const show = type === 'all' || card.dataset.type === type || (type === 'upcoming' && card.dataset.status === 'upcoming');
                card.style.display = show ? '' : 'none';
            });
        }
    </script>
