    <style>
        body { padding-top: 70px; }

        /* 로그인 화면 */
        .login-screen {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;

        /* 이벤트 셀렉터 */

        @media (max-width: 768px) {
            .admin-topbar { flex-direction: column; align-items: flex-start; }

        #past-events-section .event-tab {

    <div class="login-screen" id="login-screen">

                        </tr>
                    </thead>

    <script>
    // =============================================
    // MSAL 설정
    // =============================================
    const CLIENT_ID = '76ca8444-205c-44bb-b5db-e6c70d26891f';
    const TENANT_ID = 'bee29138-c48d-48ef-8133-9a68070b7096';
    const API_BASE  = 'https://hackersground-api.azurewebsites.net/api';

    const msalConfig = {
        auth: {
            clientId: CLIENT_ID,
            authority: `https://login.microsoftonline.com/${TENANT_ID}`,
            redirectUri: window.location.origin + '/admin/',
        },
        cache: { cacheLocation: 'sessionStorage' },
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    const loginRequest = {
        scopes: ['openid', 'profile', 'email', 'User.Read'],
    };

    // =============================================
    // 현재 데이터 상태
    // =============================================
    let currentData = [];
    let currentEvent = '';
    let eventsMap = {};  // events.json에서 로드

    // events.json 로드 후 탭 동적 생성
    async function loadEventTabs() {
        try {
            const res = await fetch('/events/events.json');
            eventsMap = await res.json();
        } catch (e) {
            console.warn('events.json 로드 실패, 기본값 사용');
            eventsMap = {};
            return;
        }

        const now = new Date();
        const cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000); // 30일 전

        const activeContainer = document.getElementById('event-tabs-active');
        const pastContainer   = document.getElementById('event-tabs-past');
        let hasPast = false;

        // date 파싱: "2025. 08. 23–24 (토·일)" → 첫 날짜만 추출
        function parseEventDate(dateStr) {
            if (!dateStr) return null;
            const m = dateStr.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
            if (!m) return null;
            return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
        }

        // 날짜순 정렬 (미래 먼저)
        const entries = Object.entries(eventsMap).sort((a, b) => {
            const da = parseEventDate(a[1].date) || new Date(9999, 0, 1);
            const db = parseEventDate(b[1].date) || new Date(9999, 0, 1);
            return da - db;
        });

        for (const [id, ev] of entries) {
            const evDate = parseEventDate(ev.date);
            // 날짜 불명확 → active로 처리
            const isPast = evDate && evDate < cutoff;

            const btn = document.createElement('button');
            btn.className = 'event-tab';
            btn.dataset.event = id;
            btn.dataset.name = ev.name;
            btn.onclick = () => selectEvent(btn, id);
            btn.textContent = (ev.emoji ? ev.emoji + ' ' : '') + ev.name;

            if (isPast) {
                pastContainer.appendChild(btn);
                hasPast = true;
            } else {
                activeContainer.appendChild(btn);
            }
        }

        if (hasPast) {
            document.getElementById('past-events-section').style.display = 'block';
        }
    }

    // =============================================
    // 초기화 (MSAL v2 — initialize() 불필요)
    // =============================================
    async function init() {
        let dashboardShown = false;
        try {
            // 리다이렉트 콜백 처리
            const redirectResponse = await msalInstance.handleRedirectPromise();
            if (redirectResponse) {
                showDashboard(redirectResponse.account);
                dashboardShown = true;
                return;
            }

            // 기존 세션 확인
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                showDashboard(accounts[0]);
                dashboardShown = true;
            }
        } catch (e) {
            console.error('MSAL init error:', e);
        } finally {
            if (!dashboardShown) showLogin();
        }
    }

    function showLogin() {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('admin-dashboard').style.display = 'none';
        // 버튼은 초기부터 활성화 상태 (v2는 동기 초기화)
    }

    // =============================================
    // 로그인 / 로그아웃
    // =============================================
    async function signIn() {
        document.getElementById('login-btn').disabled = true;
        document.getElementById('login-btn').textContent = '로그인 중...';
        try {
            // 리다이렉트 방식 (팝업은 block_nested_popups 오류 유발)
            await msalInstance.loginRedirect(loginRequest);
        } catch (e) {
            alert('로그인에 실패했어요: ' + e.message);
            document.getElementById('login-btn').disabled = false;
            document.getElementById('login-btn').innerHTML = `
                <svg class="ms-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23">
                    <rect x="1" y="1" width="10" height="10" fill="#f25022"/>
                    <rect x="12" y="1" width="10" height="10" fill="#7fba00"/>
                    <rect x="1" y="12" width="10" height="10" fill="#00a4ef"/>
                    <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
                </svg>
                Microsoft 계정으로 로그인`;
        }
    }

    async function signOut() {
        await msalInstance.logoutRedirect({ postLogoutRedirectUri: '/admin/' });
    }

    // =============================================
    // 화면 전환
    // =============================================
    function showDashboard(account) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';

        const name = account.name || account.username;
        document.getElementById('user-name').textContent = name;
        document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();

        // events.json에서 탭 동적 생성 후 전체 데이터 로드
        loadEventTabs().then(() => loadRegistrations(''));
    }

    // =============================================
    // 행사 탭 선택
    // =============================================
    function selectEvent(el, eventId) {
        document.querySelectorAll('.event-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        currentEvent = eventId;

        let title = '전체 신청자';
        if (eventId && eventsMap[eventId]) {
            title = eventsMap[eventId].name;
        } else if (eventId) {
            title = el.dataset.name || eventId;
        }
        document.getElementById('table-title').textContent = title;
        loadRegistrations(eventId);
    }

    // =============================================
    // 신청자 데이터 로드
    // =============================================
    async function loadRegistrations(eventId) {
        const tbody = document.getElementById('registrations-tbody');
        tbody.innerHTML = '<tr class="loading-row"><td colspan="8">🔄 로딩 중...</td></tr>';
        document.getElementById('csv-btn').disabled = true;

        try {
            const url = eventId
                ? `${API_BASE}/registrations?event=${encodeURIComponent(eventId)}`
                : `${API_BASE}/registrations`;

            const accounts = msalInstance.getAllAccounts();
            const userEmail = accounts.length > 0 ? accounts[0].username : '';

            const res = await fetch(url, {
                headers: { 'X-Admin-Email': userEmail },
            });

            if (res.status === 401 || res.status === 403) {
                alert('접근 권한이 없어요. 어드민 이메일 등록 여부를 확인해주세요.');
                showLogin();
                return;
            }

            const data = await res.json();
            currentData = data.registrations || [];
            renderTable(currentData);
            renderStats(currentData);
            document.getElementById('csv-btn').disabled = currentData.length === 0;

        } catch (err) {
            tbody.innerHTML = `<tr class="loading-row"><td colspan="8">❌ 오류: ${err.message}</td></tr>`;
        }
    }

    // =============================================
    // 테이블 렌더링
    // =============================================
    function renderTable(rows) {
        const tbody = document.getElementById('registrations-tbody');
        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">신청자가 없어요.</td></tr>';
            return;
        }

        const EVENT_NAMES = {
            'hackersground-2025': '해커톤 2025',
            'workshop-azure-ai': 'Azure AI',
            'docker-workshop': 'Docker',
            'growth-story': '성장스토리',
            'networking-party': '치맥파티',
            'chatgpt-workshop': 'ChatGPT',
        };

        tbody.innerHTML = rows.map((r, i) => `
            <tr>
                <td style="color:#6b7280;">${i + 1}</td>
                <td><span class="event-badge">${EVENT_NAMES[r.eventId] || r.eventId}</span></td>
                <td><strong>${r.name}</strong></td>
                <td>
                    <div>${r.email}</div>
                    ${r.phone ? `<div class="email">${r.phone}</div>` : ''}
                </td>
                <td>${r.phone || '<span style="color:#4b5563">-</span>'}</td>
                <td>${r.affiliation || '<span style="color:#4b5563">-</span>'}</td>
                <td class="message">${r.message || '<span style="color:#4b5563">-</span>'}</td>
                <td class="date">${formatDate(r.registeredAt)}</td>
            </tr>
        `).join('');
    }

    // =============================================
    // 통계 렌더링
    // =============================================
    function renderStats(rows) {
        const today = new Date().toISOString().slice(0, 10);
        const todayCount = rows.filter(r => r.registeredAt?.startsWith(today)).length;
        const affiliCount = rows.filter(r => r.affiliation).length;

        document.getElementById('stat-total').textContent = rows.length;
        document.getElementById('stat-today').textContent = todayCount;
        document.getElementById('stat-with-affil').textContent = affiliCount;
    }

    // =============================================
    // CSV 다운로드
    // =============================================
    function downloadCSV() {
        if (currentData.length === 0) return;

        const headers = ['#', '행사', '이름', '이메일', '전화', '소속', '한마디', '신청일시'];
        const rows = currentData.map((r, i) => [
            i + 1, r.eventId, r.name, r.email,
            r.phone, r.affiliation, r.message, formatDate(r.registeredAt)
        ]);

        const csvContent = [headers, ...rows]
            .map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
            .join('\n');

        const bom = '\uFEFF'; // UTF-8 BOM (Excel 한글 지원)
        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `신청자_${currentEvent || '전체'}_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }

    // =============================================
    // 유틸
    // =============================================
    function formatDate(isoStr) {
        if (!isoStr) return '-';
        try {
            return new Date(isoStr).toLocaleString('ko-KR', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit',
            });
        } catch { return isoStr; }
    }

    // 초기화
    init();
    </script>
</body>
</html>
