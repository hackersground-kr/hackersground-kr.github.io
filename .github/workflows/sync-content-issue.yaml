name: Publish content issue

on:
  issues:
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: read

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'content-publish') && (contains(github.event.issue.labels.*.name, 'post') || contains(github.event.issue.labels.*.name, 'event'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync the closed issue to Azure Table Storage
        env:
          CONTENT_SYNC_URL: ${{ vars.CONTENT_SYNC_URL }}
          CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: node _scripts/sync_issue_content.mjs

      - name: Commit synchronized metadata
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts events
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: issue #${{ github.event.issue.number }} 콘텐츠 메타데이터 동기화"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy generated short link
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yaml --ref main
