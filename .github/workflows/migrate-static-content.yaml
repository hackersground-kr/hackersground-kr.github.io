name: Migrate static content to Azure Table Storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import existing posts and events
        env:
          CONTENT_SYNC_URL: ${{ vars.CONTENT_SYNC_URL }}
          CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: node _scripts/migrate_static_content.mjs

      - name: Commit DB-backed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/posts.json events/events.json
          git diff --staged --quiet || git commit -m "chore: 정적 콘텐츠 DB 이관 메타데이터 동기화 [skip ci]"
          git push
