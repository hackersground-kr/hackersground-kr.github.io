name: Migrate short links

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assign IDs and generate short links
        env:
          CONTENT_SYNC_URL: ${{ vars.CONTENT_SYNC_URL }}
          CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: node _scripts/migrate_short_links.mjs

      - name: Commit generated short links
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts events
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: 기존 콘텐츠 단축 URL 생성"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy generated short links
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yaml --ref main
