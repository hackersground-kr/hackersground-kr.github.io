name: Announce posts on Discord

on:
  workflow_dispatch:
    inputs:
      short_ids:
        description: Comma-separated post short IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce selected posts
        env:
          DISCORD_ARTICLE_WEBHOOK: ${{ secrets.DISCORD_ARTICLE_WEBHOOK }}
          POST_SHORT_IDS: ${{ inputs.short_ids }}
        run: node _scripts/announce_discord_posts.mjs
