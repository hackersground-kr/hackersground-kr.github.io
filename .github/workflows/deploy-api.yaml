name: Deploy API to Azure Functions

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Set RESEND_API_KEY in Function App
        run: |
          az functionapp config appsettings set \
            --name hackersground-api \
            --resource-group hackersground-community \
            --settings "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: hackersground-api
          package: api
