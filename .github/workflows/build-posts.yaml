name: Build Posts from Markdown

on:
  push:
    branches: ["main"]
    paths:
      - "_posts/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build posts HTML
        run: python _scripts/build_posts.py

      - name: Inject analytics tags (GTM + Naver)
        run: python _scripts/inject_analytics.py

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --staged --quiet || git commit -m "chore: _posts 변경에서 HTML 자동 생성 [skip ci]"
          git push
