name: "📚 정보글 발행"
description: "Markdown으로 정보글을 작성하고, 이슈를 닫아 발행합니다."
title: "[정보글] "
labels: ["post", "content-publish"]
body:
  - type: markdown
    attributes:
      value: |
        이슈를 닫으면 Azure Table Storage에 발행됩니다.
        본문은 GitHub Flavored Markdown을 지원합니다. YouTube는 `@[youtube](URL)`, 단독 URL 또는 YouTube를 가리키는 썸네일 링크 형식으로 넣을 수 있습니다.
  - type: input
    id: slug
    attributes:
      label: Slug
      description: "날짜-주제 형식으로 작성합니다. 예: 2026-08-22-ai-game-dev-insight (YYYY-MM-DD-주제-키워드, 영문 소문자·숫자·하이픈만 사용)"
      placeholder: "YYYY-MM-DD-topic-keyword"
    validations:
      required: true
  - type: input
    id: content-title
    attributes:
      label: 제목
    validations:
      required: true
  - type: input
    id: excerpt
    attributes:
      label: 한 줄 요약
    validations:
      required: true
  - type: input
    id: emoji
    attributes:
      label: 이모지
      value: "📝"
  - type: input
    id: tag
    attributes:
      label: 태그
      description: "예: ai, azure, github, career, opensource"
      value: "other"
  - type: textarea
    id: markdown
    attributes:
      label: 본문 (Markdown)
    validations:
      required: true
