name: "🗓️ 행사 발행"
description: "Markdown으로 행사를 작성하고, 이슈를 닫아 발행합니다."
title: "[행사] "
labels: ["event", "content-publish"]
body:
  - type: markdown
    attributes:
      value: |
        이슈를 닫으면 Azure Table Storage에 발행됩니다.
        본문은 GitHub Flavored Markdown을 지원합니다. YouTube는 `@[youtube](URL)`, 단독 URL 또는 YouTube를 가리키는 썸네일 링크 형식으로 넣을 수 있습니다.
  - type: input
    id: slug
    attributes:
      label: Slug
      description: "영문 소문자, 숫자, 하이픈만 사용합니다."
    validations:
      required: true
  - type: input
    id: content-title
    attributes:
      label: 제목
    validations:
      required: true
  - type: input
    id: excerpt
    attributes:
      label: 한 줄 요약
    validations:
      required: true
  - type: input
    id: emoji
    attributes:
      label: 이모지
      value: "🗓️"
  - type: input
    id: tag
    attributes:
      label: 태그
      value: "event"
  - type: input
    id: start-at
    attributes:
      label: 시작 시각
      description: "ISO 8601 형식. 예: 2026-09-10T07:00:00+09:00"
  - type: input
    id: end-at
    attributes:
      label: 종료 시각
  - type: input
    id: location
    attributes:
      label: 장소
  - type: input
    id: event-type
    attributes:
      label: 유형
      description: "예: online, offline, hybrid"
  - type: input
    id: price
    attributes:
      label: 참가비
      value: "무료"
  - type: input
    id: capacity
    attributes:
      label: 모집 인원
  - type: input
    id: registration-url
    attributes:
      label: 신청 링크
  - type: textarea
    id: markdown
    attributes:
      label: 본문 (Markdown)
    validations:
      required: true
