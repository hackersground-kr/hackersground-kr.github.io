<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07180d"/>
      <stop offset="0.54" stop-color="#020302"/>
      <stop offset="1" stop-color="#07110c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.92" cy="0.06" r="0.82">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#00ff41" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="stampRough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
    </filter>
    <filter id="stampGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff1a2e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#background)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect x="28" y="28" width="1024" height="1294" rx="28" fill="none" stroke="#00ff41" stroke-opacity="0.55" stroke-width="2"/>

  <g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" opacity="0.62">
    <circle cx="87" cy="88" r="8" fill="#00ff41"/>
    <text x="110" y="97" fill="#00ff41" font-family="Menlo, monospace" font-size="24" font-weight="700" letter-spacing="2">HACKERS GROUND</text>
    <text x="918" y="97" fill="#b9c0c9" font-family="Menlo, monospace" font-size="20">EVENT 07</text>

    <rect x="76" y="166" width="373" height="56" rx="28" fill="#00ff41"/>
    <text x="105" y="204" fill="#000" font-family="Menlo, monospace" font-size="22" font-weight="700">VIBE CODING WORKSHOP</text>

    <text x="76" y="339" fill="#fff" font-size="78" font-weight="900" letter-spacing="-4">AI와 함께</text>
    <text x="76" y="438" fill="#00ff41" font-size="78" font-weight="900" letter-spacing="-4">나만의 홈페이지</text>
    <text x="76" y="537" fill="#fff" font-size="78" font-weight="900" letter-spacing="-4">만들기</text>
    <text x="80" y="600" fill="#b9c0c9" font-size="29" font-weight="400">코딩 경험이 없어도, AI와 함께 시작해요.</text>

    <line x1="76" x2="1004" y1="664" y2="664" stroke="#fff" stroke-opacity="0.18"/>

    <g filter="url(#shadow)">
      <rect x="76" y="710" width="928" height="142" rx="20" fill="#0d1810" stroke="#00ff41" stroke-opacity="0.42"/>
      <text x="116" y="765" fill="#00ff41" font-family="Menlo, monospace" font-size="20" font-weight="700">WHEN</text>
      <text x="116" y="817" fill="#fff" font-size="38" font-weight="700">9.28 MON  10:30 - 12:00</text>

      <rect x="76" y="876" width="928" height="142" rx="20" fill="#0d1810" stroke="#00ff41" stroke-opacity="0.42"/>
      <text x="116" y="931" fill="#00ff41" font-family="Menlo, monospace" font-size="20" font-weight="700">WHERE</text>
      <text x="116" y="983" fill="#fff" font-size="38" font-weight="700">수성구 들안길 일대</text>
    </g>

    <text x="76" y="1086" fill="#fff" font-size="32" font-weight="800">90분 실습 워크샵</text>
    <text x="76" y="1134" fill="#b9c0c9" font-size="26">AI 도구 세팅부터 홈페이지 제작, 배포까지</text>

    <rect x="76" y="1183" width="928" height="74" rx="37" fill="#00ff41"/>
    <text x="540" y="1231" fill="#000" text-anchor="middle" font-size="27" font-weight="900">노트북 지참 · 선착순 20명 · 참가비 50,000원</text>

    <text x="76" y="1292" fill="#b9c0c9" font-size="20">정확한 진행 장소는 신청 후 이메일로 안내드립니다.</text>
    <text x="1004" y="1292" fill="#00ff41" text-anchor="end" font-family="Menlo, monospace" font-size="20" font-weight="700">hackersground.kr/events/7</text>
  </g>

  <!-- red stamp -->
  <g transform="rotate(-18 540 675)" filter="url(#stampGlow)" opacity="0.94">
    <g filter="url(#stampRough)">
      <rect x="170" y="470" width="740" height="410" rx="34" fill="none" stroke="#ff1a2e" stroke-width="16"/>
      <rect x="196" y="496" width="688" height="358" rx="24" fill="none" stroke="#ff1a2e" stroke-width="5"/>
      <text x="540" y="782" fill="#ff1a2e" text-anchor="middle" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="250" font-weight="900" letter-spacing="18">마감</text>
    </g>
  </g>
</svg>
