    <title>정보글 · 해커그라운드</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MZT9L6Z5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/"><img src="../images/1920x480-1.png" alt="해커그라운드 로고" class="logo-image"></a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="/events/" class="nav-link">Events</a></li>
                <li class="nav-item"><a href="/posts/" class="nav-link" style="color: var(--primary-green);">Posts</a></li>
                <li class="nav-item"><a href="/#about" class="nav-link">About</a></li>
            </ul>
            <div class="nav-toggle" id="mobile-menu">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <div class="breadcrumb"><a href="/">Home</a><span class="sep">›</span>Posts</div>
            <h1>📚 깨알 정보글</h1>
            <p>개발, 클라우드, 커리어 — 유용한 정보를 모아뒀어요.</p>
        </div>
    </div>

    <section class="posts-section">
        <div class="container">
            <div class="filter-bar">
                <button onclick="filterPosts('all')" id="filter-all" class="filter-btn active">전체</button>
                <button onclick="filterPosts('ai')" id="filter-ai" class="filter-btn">AI</button>
                <button onclick="filterPosts('azure')" id="filter-azure" class="filter-btn">Azure</button>
                <button onclick="filterPosts('github')" id="filter-github" class="filter-btn">GitHub</button>
                <button onclick="filterPosts('career')" id="filter-career" class="filter-btn">커리어</button>
                <button onclick="filterPosts('opensource')" id="filter-opensource" class="filter-btn">오픈소스</button>
            </div>

            <div class="posts-list" data-content-list="post"></div>

            <div class="community-cta" style="margin-top: 4rem;">
                <h3>공유하고 싶은 팁이 있다면?</h3>
                <p>GitHub 이슈로 정보글을 제안해주세요. 같이 만들어가요!</p>
                <div class="btn-group">
                    <a href="https://github.com/hackersground-kr/hackersground-kr.github.io/issues/new?template=publish-post.yml" target="_blank" class="btn-primary">✍️ 정보글 작성하기</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><img src="../images/1920x480-1.png" alt="해커그라운드 로고" class="footer-logo-image"></div>
                <div class="footer-info">
                    <h3>Contact</h3>
                    <p>📧 events@hackersground.kr</p>
                    <div class="social-links">
                        <a href="https://github.com/hackersground-kr" target="_blank" class="social-link"><span>📱 GitHub</span></a>
                        <a href="https://www.youtube.com/@hackersground-kr" target="_blank" class="social-link"><span>📺 YouTube</span></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom"><p>&copy; 2025 해커그라운드(Hackers Ground). All rights reserved.</p></div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/content.js"></script>
    <script>
        function filterPosts(tag) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('filter-' + tag).classList.add('active');
            document.querySelectorAll('.post-item').forEach(item => {
                item.style.display = (tag === 'all' || item.dataset.tag === tag) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
